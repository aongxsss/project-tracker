  <!-- Folder tab (slightly lighter pink) -->
  <path d="M14 24H28L30 26H50C51.7 26 53 27.3 53 29V32H11V26.5C11 25.1 12.1 24 13.5 24H14Z"
        fill="#FCE7F3"/>

