  <!-- Ears -->
  <ellipse cx="27" cy="26" rx="3.5" ry="9" fill="#FFF1F2"/>
  <ellipse cx="37" cy="26" rx="3.5" ry="9" fill="#FFF1F2"/>

  <!-- Inner ears -->
  <ellipse cx="27" cy="26" rx="1.6" ry="6.5" fill="#F9A8D4"/>
  <ellipse cx="37" cy="26" rx="1.6" ry="6.5" fill="#F9A8D4"/>

  <!-- Eyes -->
  <circle cx="29" cy="40" r="1.7" fill="#374151"/>
  <circle cx="35" cy="40" r="1.7" fill="#374151"/>

  <!-- Mouth -->
  <path d="M31 43 L32 44 L33 43"
        fill="none"
        stroke="#FB7185"
        stroke-width="1.2"
        stroke-linecap="round"/>

  <!-- Tracking badge -->
  <circle cx="50" cy="48" r="6.5" fill="#FFFFFF"/>
  <path d="M47.5 48L49 49.8L52.5 45.5"
        fill="none"
